
name: Check firmware update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 10,20,28 * *"
  push:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}

      - name: Fetch new Play Integrity Config
        run: |
          bash autopif4.sh
          if [ -f pif.json ]; then
            mkdir -p pif
            mv pif.json pif/pif.json
          else
            echo "pif.json tidak dibuat oleh script."
            exit 1
          fi

      - name: Update current version
        id: update
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add pif/pif.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada perubahan pada pif/pif.json."
          else
            git commit -m "Update Play Integrity Fix config"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes to repo
        if: steps.update.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          branch: ${{ github.ref_name }}
          tags: true
